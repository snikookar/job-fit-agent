text: |
  # Senior Backend Engineer (Python)

  Location: Hamburg, Germany

  At Harborline we build software for container terminals.

  ## What you'll do

  - Own services that process millions of container movements
  - Improve reliability and performance of our APIs

  ## What we're looking for

  - 5+ years of backend development experience
  - Strong Python skills with Django or FastAPI
  - Deep knowledge of PostgreSQL, including query optimization
  - Experience designing REST APIs
  - Experience with message queues such as RabbitMQ or Kafka
  - Experience with Docker

  ## Bonus

  - Experience with AWS
  - Infrastructure as code with Terraform

  We offer visa sponsorship and relocation support.
