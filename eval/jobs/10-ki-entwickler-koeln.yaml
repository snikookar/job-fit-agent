text: |
  # KI-Entwickler (m/w/d)

  Standort: Köln (hybrid)

  Rheinwerk Digital entwickelt KI-Lösungen für Versicherungen.

  ## Deine Aufgaben

  - Entwicklung von LLM-Anwendungen für unsere Kunden
  - Betrieb und Weiterentwicklung unserer Plattform

  ## Das bringst du mit

  - Mehrjährige Erfahrung mit Python
  - Erfahrung mit LLMs und RAG
  - Kenntnisse in PostgreSQL
  - Erfahrung mit Docker
  - Sehr gute Deutsch- und Englischkenntnisse

  ## Wünschenswert

  - Erfahrung mit LangChain oder LangGraph
  - Erfahrung mit Microsoft Azure
