id: data-engineer-amsterdam
fit_rating: 3
text: |
  # Data Engineer

  Location: Amsterdam, Netherlands

  Tulipwise helps grocery chains reduce food waste with data.

  ## Requirements

  - 3+ years of experience building data pipelines
  - Experience with Apache Airflow
  - Strong SQL skills
  - Python for data processing
  - Experience with Apache Spark
  - Experience implementing data quality checks

  ## Nice to have

  - Experience with dbt
  - Experience with Snowflake or BigQuery
  - Dutch language skills
