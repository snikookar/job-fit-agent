text: |
  # Research Scientist, Machine Learning

  Location: Paris, France

  Lumen Labs does fundamental research on efficient language models.

  ## Qualifications

  - PhD in machine learning or a related field
  - Publications at NeurIPS, ICML or ICLR
  - Expert knowledge of PyTorch
  - Experience with deep learning research

  ## Ideally

  - Experience with large-scale distributed training
  - French language skills
