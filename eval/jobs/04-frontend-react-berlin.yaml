text: |
  # Senior Frontend Engineer

  Location: Berlin, Germany (remote within the EU)

  Pixelmoss builds design tools for small agencies.

  ## You bring

  - 4+ years of experience with React and TypeScript
  - Excellent CSS skills and a strong eye for detail
  - Experience with Next.js
  - Experience with web accessibility (WCAG)
  - Experience testing UIs with Jest and Playwright

  ## Nice to have

  - Experience building a design system
  - Experience with GraphQL
