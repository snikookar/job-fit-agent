text: |
  # Systems Engineer (Rust)

  Location: Zurich, Switzerland (onsite)

  Glacierdb is building a new storage engine.

  ## Requirements

  - 3+ years of professional Rust experience
  - Strong background in systems programming
  - Knowledge of Linux internals (memory, I/O, scheduling)
  - Experience with C++

  ## Nice to have

  - Experience with embedded systems
  - Contributions to open-source databases

  We are unable to offer visa sponsorship.
